[package]
name = "cargo-robocode"
version = "0.1.0"
edition = "2024"
publish = false
license = "EPL-1.0"
description = "Write, battle and verify robocode robots locally: cargo robocode"

[[bin]]
name = "cargo-robocode"
path = "src/main.rs"

[dependencies]
robocode = { path = ".." }
clap = { version = "=4.6.7", features = ["derive"] }
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
webbrowser = "=1.2.4"
dirs = "=7.0.0"

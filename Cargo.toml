[package]
name = "robocode"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["CryptoPatrick <cryptopatrick@gmail.com>"]

###############################################################################
description = "Robot Combat Simulator"
documentation = "https://docs.rs/robocode"
homepage = "https://github.com/cryptopatrick/robocode"
repository = "https://github.com/cryptopatrick/robocode"
readme = "README.md"
keywords = ["Simulator"]
categories = ["development-tools"]
license = "EPL-1.0"
autotests = true
# Only what is needed to build and test the library goes to crates.io.
include = ["/src", "/examples", "/tests", "/README.md", "/LICENSE", "/COPYING", "/CHANGELOG.md"]
[lib]
name = "robocode"
path = "src/lib.rs"

[dependencies]
vstd = { version = "=0.0.0-2026-11-01-0251", optional = true }

[features]
# Enables Verus specs and proofs (RoboVerus). Off by default: no Verus crates are compiled.
verus = ["dep:vstd"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

[workspace]
members = [".", "exercises", "solutions", "wasm", "cli", "mutants", "robocheck"]

# Like the default `test` profile, but without debug assertions, so tests also
# run the code paths a release build uses (see docs/improvements-from-jiff.md).
[profile.testrelease]
inherits = "test"
debug-assertions = false

[[bench]]
name = "battle"
harness = false

[dev-dependencies]
# Property tests (tests/properties.rs). Pinned; released 2026-02, MSRV 1.85.
quickcheck = { version = "=1.1.0", default-features = false }
# Snapshot tests (tests/snapshots.rs). Pinned; released 2026-10, MSRV 1.66.
insta = "=1.49.0"

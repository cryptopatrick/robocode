[package]
name = "robocode"
version = "0.1.0"
edition = "2024"
authors = ["CryptoPatrick <cryptopatrick@gmail.com>"]

###############################################################################
description = "Tank Combat Model Interface"
documentation = "https://docs.rs/robocode"
homepage = "https://github.com/cryptopatrick/robocode"
repository = "https://github.com/cryptopatrick/robocode"
readme = "README.md"
keywords = ["Simulator"]
categories = ["development-tools"]
license = "MIT"
autotests = true
[lib]
name = "robocode"
path = "src/lib.rs"

[dependencies]
vstd = { version = "=0.0.0-2026-11-01-0251", optional = true }

[features]
# Enables Verus specs and proofs (RoboVerus). Off by default: no Verus crates are compiled.
verus = ["dep:vstd"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

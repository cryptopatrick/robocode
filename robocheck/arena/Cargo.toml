[package]
name = "robocheck-arena"
version = "0.1.0"
edition = "2024"
publish = false
license = "EPL-1.0"
description = "RoboCheck's extension of robocode 0.5.0: building clearance, a per-turn decision log and an executable `ready`, using only robocode's public API"

[dependencies]
robocode = { path = "../.." }
vstd = { version = "=0.0.0-2026-11-01-0251", optional = true }

[features]
# Verus specs and proofs, as in robocode itself.
verus = ["robocode/verus", "dep:vstd"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

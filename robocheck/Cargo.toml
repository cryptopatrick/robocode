[package]
name = "robocheck"
version = "0.1.0"
edition = "2024"
publish = false
license = "EPL-1.0"
description = "RoboCheck: verify a candidate robot strategy against a human-written Verus spec, then battle the same code"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing"] }

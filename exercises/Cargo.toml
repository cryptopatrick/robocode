[package]
name = "roboverus-exercises"
version = "0.1.0"
edition = "2024"
publish = false
license = "EPL-1.0"
description = "RoboVerus guide exercises"

[dependencies]
robocode = { path = "..", features = ["verus"] }
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[lints.rust]
# Assertions are erased outside Verus, leaving some variables unused in plain builds.
unused_variables = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

[lints.clippy]
# Mirrors the Verus guide's style.
len_zero = "allow"
manual_clamp = "allow"

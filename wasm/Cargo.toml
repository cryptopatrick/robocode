[package]
name = "robocode-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "EPL-1.0"
description = "Runs robocode battles in the browser and returns JSON recordings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
robocode = { path = ".." }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
